<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Predictor — Tin tức, kết quả, bảng xếp hạng & dự đoán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ HỆ THỐNG MÀU ============ */
  :root{--bg:#0a0d12;--s1:#11151c;--s2:#171c25;--s3:#1d2330;--line:#222a36;--ink:#eaeef4;--mute:#8d97a8;--gold:#f5c04a;--r:14px;
    --disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif}
  body{--brand:#38003c;--a1:#00e08a;--on:#00180d}
  body[data-l="esp.1"]{--brand:#8c0f1f;--a1:#ffb81c;--on:#1a1000}
  body[data-l="ita.1"]{--brand:#0b3a8f;--a1:#27d8c8;--on:#00201d}
  body[data-l="ger.1"]{--brand:#a8101c;--a1:#ff6b6b;--on:#2a0003}
  body[data-l="uefa.champions"]{--brand:#0a1f5c;--a1:#5ab0ff;--on:#001126}

  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .sub{font-size:13px;color:var(--mute)}
  .empty{padding:22px 0;text-align:center;color:var(--mute);font-size:13px}
  .clk{cursor:pointer}

  /* ============ HEADER ============ */
  .top{background:var(--brand);transition:background .3s}
  .top-in{max-width:1180px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;gap:26px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.2px;white-space:nowrap;color:#fff;cursor:pointer}
  .brand i{width:32px;height:32px;border-radius:9px;background:#fff;display:grid;place-items:center;font-style:normal;font-size:17px}
  .leagues{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
  .leagues::-webkit-scrollbar{display:none}
  .lg{flex:none;border:0;background:transparent;color:rgba(255,255,255,.72);font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
  .lg:hover{background:rgba(255,255,255,.12);color:#fff}
  .lg.on{background:#fff;color:var(--brand)}
  .actions{display:flex;align-items:center;gap:12px;flex:none}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:rgba(255,255,255,.75)}
  .live:before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80}
  #btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#fff;transition:.15s}
  #btn:hover{background:rgba(255,255,255,.2)}#btn:disabled{opacity:.6;cursor:wait}

  .sections{position:sticky;top:0;z-index:30;background:rgba(10,13,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .sec-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .sec-in::-webkit-scrollbar{display:none}
  .sec{position:relative;flex:none;padding:0 16px;height:48px;display:flex;align-items:center;gap:7px;font-weight:600;color:var(--mute);white-space:nowrap;transition:color .15s}
  .sec:hover{color:#fff}
  .sec.on{color:#fff}
  .sec.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--a1)}

  /* ============ BANNER ============ */
  .ad{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 14px;border-radius:12px;border:1px solid rgba(245,192,74,.35);
    background:linear-gradient(90deg,rgba(245,192,74,.13),rgba(245,192,74,.03))}
  .adav{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#fff;color:#222;font-weight:800;border:2px solid var(--gold)}
  .adav img{width:100%;height:100%;object-fit:cover}
  .adtxt{min-width:0;flex:1;line-height:1.3}
  .adtag{display:block;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold)}
  .adtxt b{font-size:14px;font-weight:700}
  #adLine{display:block;font-size:12.5px;color:var(--mute);transition:opacity .35s,transform .35s}
  #adLine.out{opacity:0;transform:translateY(5px)}
  .adcta{flex:none;font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:8px;background:var(--gold);color:#201500}
  .adx{flex:none;width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.08);color:var(--mute);font-size:11px;line-height:1}
  .adx:hover{background:rgba(255,255,255,.16);color:#fff}
  .ad.shake{animation:shk .4s}
  @keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  #view{padding-top:20px;min-height:60vh}
  .view-title{font-size:26px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
  .view-sub{color:var(--mute);margin-bottom:18px}
  .skel{opacity:.5}

  /* ============ THÀNH PHẦN CHUNG ============ */
  .card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  h2{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.2px}
  h2:before{content:"";width:3px;height:16px;border-radius:2px;background:var(--a1)}
  .ch>span,.ch>a{font-size:12px;color:var(--mute)}
  .ch>a:hover{color:var(--a1)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;margin-top:20px;align-items:start}
  .main,.side{display:flex;flex-direction:column;gap:20px;min-width:0}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .day{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);padding:14px 0 6px}
  .day:first-child{padding-top:2px}
  .ico{width:32px;height:32px;border-radius:50%;background:#fff;display:inline-grid;place-items:center;overflow:hidden;font-size:10px;font-weight:800;color:#222;flex:none}
  .ico img{width:22px;height:22px;object-fit:contain}
  .ico.s24{width:24px;height:24px}.ico.s24 img{width:17px;height:17px}
  .ico.s28{width:28px;height:28px}.ico.s28 img{width:20px;height:20px}
  .ico.s44{width:44px;height:44px}.ico.s44 img{width:30px;height:30px}
  .ico.s56{width:56px;height:56px;font-size:15px}.ico.s56 img{width:40px;height:40px}
  .ico.s84{width:84px;height:84px;font-size:22px}.ico.s84 img{width:60px;height:60px}
  .tn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{border:1px solid var(--line);background:var(--s1);color:var(--mute);padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
  .chip:hover{color:#fff}
  .chip.on{background:var(--a1);color:var(--on);border-color:transparent}
  .badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:11px;font-weight:800;color:#fff}
  .badge.W{background:#16a34a}.badge.D{background:#64748b}.badge.L{background:#dc2626}
  .form{display:inline-flex;gap:4px}
  .zone-bar{display:flex;gap:4px}

  /* ============ HERO ============ */
  .hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:32px;align-items:center;padding:32px 36px;
    background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
  .hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a1)}
  .hero:after{content:"";position:absolute;right:-90px;top:-110px;width:380px;height:380px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,color-mix(in srgb,var(--a1) 14%,transparent),transparent 66%)}
  .hero>*{position:relative;z-index:1}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--a1)}
  .champ{display:flex;align-items:center;gap:20px;margin:14px 0 24px;min-width:0}
  .name{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(38px,5.5vw,64px);line-height:.95;letter-spacing:-.3px}
  .sub2{margin-top:6px;font-size:13px;color:var(--mute)}
  .kpis{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
  .kpi{padding:0 28px;border-left:1px solid var(--line)}
  .kpi:first-child{padding-left:0;border-left:0}
  .kpi b{display:block;font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi span{font-size:12px;color:var(--mute)}
  .gap{margin-top:16px;font-size:13px;color:var(--mute)}.gap b{color:#fff;font-weight:600}
  .gauge{justify-self:center;position:relative;width:220px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
  .gauge:before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--s1)}
  .gauge .in{position:relative;text-align:center}
  .pct{font-family:var(--disp);font-weight:800;font-size:56px;line-height:1;color:var(--gold)}
  .pct small{font-size:26px}
  .gauge .cap{margin-top:4px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .sc{padding:16px 22px;border-left:1px solid var(--line);min-width:0}
  .sc:first-child{border-left:0}
  .sc span{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
  .sc b{display:block;font-size:24px;font-weight:700;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
  .sc small{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog{height:4px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--a1)}

  /* ============ CUỘC ĐUA ============ */
  .th,.row{display:grid;grid-template-columns:24px 32px minmax(0,1fr) 44px 44px 170px;gap:12px;align-items:center}
  .th{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute);padding:4px 0 8px;border-bottom:1px solid var(--line)}
  .th .c{text-align:center}
  .row{padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
  .th+.rows .row:first-child{border-top:0}
  .rk{text-align:center;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
  .num{text-align:center;color:var(--mute);font-variant-numeric:tabular-nums}
  .num.pts{color:#fff;font-weight:700}
  .prob{display:flex;align-items:center;gap:10px}
  .bar{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px;background:var(--a1);transition:width .8s}
  .pc{width:52px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .row:hover .tn{color:var(--a1)}
  .row.top1{background:rgba(245,192,74,.07);margin:0 -12px;padding:11px 12px;border-radius:10px;border-top-color:transparent}
  .row.top1+.row{border-top-color:transparent}
  .row.top1 .rk,.row.top1 .pc{color:var(--gold)}
  .row.top1 .bar i{background:var(--gold)}

  /* ============ TRẬN ĐẤU ============ */
  .mrow{display:grid;grid-template-columns:62px minmax(0,1fr) 64px minmax(0,1fr);gap:10px;align-items:center;padding:12px 8px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background .15s}
  .mrow:hover{background:rgba(255,255,255,.04)}
  .day+.mrow,.mrow:first-child{border-top:0}
  .mrow .st{font-size:12px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
  .mrow .st.in{color:#f87171}
  .mrow .t{display:flex;align-items:center;gap:10px;min-width:0;font-weight:600}
  .mrow .t.home{justify-content:flex-end;text-align:right}
  .mrow .t span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .t.win span.n{color:#fff}
  .mrow .t.lose span.n{color:var(--mute);font-weight:500}
  .scr{text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;padding:4px 0;border-radius:6px;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
  .scr.live{border-color:#ef4444;color:#fff}
  .scr.pre{font-weight:600;color:var(--mute);font-size:12px}
  .liveb{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;background:#ef4444;padding:2px 7px;border-radius:5px}
  .datenav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .dbtn{border:1px solid var(--line);background:var(--s1);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:16px;display:grid;place-items:center}
  .dbtn:hover{border-color:var(--a1);color:var(--a1)}
  .dcur{flex:1;min-width:180px;text-align:center;font-weight:700;font-size:16px}
  .dcur small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
  .dinp{border:1px solid var(--line);background:var(--s1);color:var(--ink);border-radius:10px;height:40px;padding:0 10px;font:inherit;color-scheme:dark}
  .tbtn{border:1px solid var(--line);background:var(--s1);border-radius:10px;height:40px;padding:0 14px;cursor:pointer;font-weight:600}
  .tbtn:hover{border-color:var(--a1);color:var(--a1)}

  /* chi tiết trận */
  .back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;color:var(--mute);font-weight:600;cursor:pointer;background:none;border:0;padding:0}
  .back:hover{color:var(--a1)}
  .mh{padding:28px 24px;text-align:center;position:relative;overflow:hidden}
  .mh:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--a1)}
  .mh .meta{font-size:12px;color:var(--mute);letter-spacing:.5px;text-transform:uppercase}
  .mh .teams{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin:18px 0 10px}
  .mh .tm{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:18px;cursor:pointer;min-width:0}
  .mh .tm:hover{color:var(--a1)}
  .mh .big{font-family:var(--disp);font-weight:800;font-size:64px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .mh .stt{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--mute)}
  .mh .stt.in{color:#fff;background:#ef4444;padding:2px 10px;border-radius:6px}
  .mh .info{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--mute)}
  .seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--s2);border:1px solid var(--line);margin:18px 0 14px}
  .seg button{border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:600;padding:8px 16px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--a1);color:var(--on)}
  .tl{display:grid;grid-template-columns:52px 28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
  .tl:first-child{border-top:0}
  .tl .min{font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
  .tl .ic{font-size:16px;text-align:center}
  .tl b{font-weight:600}
  .tl small{display:block;color:var(--mute);font-size:12px}
  .tl.goal{background:linear-gradient(90deg,rgba(245,192,74,.08),transparent);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px}
  .sb{padding:11px 0;border-top:1px solid var(--line)}
  .sb:first-child{border-top:0}
  .sb .r{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
  .sb .r span:first-child{text-align:left}.sb .r span:last-child{text-align:right}
  .sb .r em{font-style:normal;text-align:center;color:var(--mute);font-weight:500;font-size:12.5px}
  .sb .bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
  .sb .bars i{display:block;height:6px;background:var(--s3);border-radius:4px;overflow:hidden;position:relative}
  .sb .bars i b{position:absolute;top:0;bottom:0;border-radius:4px}
  .sb .bars i:first-child b{right:0;background:var(--a1)}
  .sb .bars i:last-child b{left:0;background:#cbd5e1}
  .lu{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .lu h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .lu h3 small{color:var(--mute);font-weight:500}
  .lu .p{display:grid;grid-template-columns:28px minmax(0,1fr) 34px;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
  .lu .p .j{font-weight:700;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
  .lu .p .po{font-size:11px;color:var(--mute);text-align:right}
  .lu .sh{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mute);padding:12px 0 2px}
  .lu .subd{color:#f87171;font-size:11px;margin-left:6px}
  .lu .subi{color:#4ade80;font-size:11px;margin-left:6px}

  /* ============ BẢNG XẾP HẠNG ============ */
  .tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .ft-h,.ft{display:grid;grid-template-columns:30px 32px minmax(150px,1fr) 34px 32px 32px 32px 34px 34px 40px 44px 110px 64px;gap:8px;align-items:center;min-width:760px}
  .ft-h{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute);padding:4px 0 8px 4px;border-bottom:1px solid var(--line)}
  .ft-h .c,.ft .c{text-align:center}
  .ft{padding:8px 0 8px 4px;border-top:1px solid var(--line);border-left:3px solid transparent;transition:background .15s;cursor:pointer}
  .ft:hover{background:rgba(255,255,255,.03)}
  .ft:hover .tn{color:var(--a1)}
  .ft .c{font-variant-numeric:tabular-nums;color:var(--mute)}
  .ft .c.p{color:#fff;font-weight:700}
  .ft .tmc{display:flex;align-items:center;gap:10px;min-width:0}
  .z-g{border-left-color:#34d399}.z-b{border-left-color:#60a5fa}.z-t{border-left-color:#2dd4bf}.z-r{border-left-color:#f87171}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:12px;color:var(--mute)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  /* ============ DỰ ĐOÁN TRẬN ============ */
  .pg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .pm{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink);cursor:pointer;transition:border-color .15s}
  .pm:hover{border-color:var(--a1)}
  .pm .when{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
  .pm .vs3{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
  .pm .tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:600;min-width:0}
  .pm .tm span.n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pm .ps{font-family:var(--disp);font-size:36px;font-weight:800;line-height:1;text-align:center;white-space:nowrap}
  .wdl{display:flex;gap:2px;height:6px;margin-top:14px}
  .wdl i{display:block;height:100%;border-radius:3px}
  .wdl .h{background:var(--a1)}.wdl .x{background:#4a5565}.wdl .a{background:#cbd5e1}
  .wl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
  .wl b{color:#fff;font-variant-numeric:tabular-nums}
  .pick{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mute)}
  .pick span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick b{color:#fff}.pick .xg{flex:none;font-variant-numeric:tabular-nums}

  /* ============ KẾT QUẢ / LỊCH (cột phải) ============ */
  .mini{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
  .mini:hover .n{color:var(--a1)}
  .day+.mini{border-top:0}
  .mini .t{display:flex;align-items:center;gap:8px;min-width:0}
  .mini .t:last-child{justify-content:flex-end;text-align:right}
  .mini .t .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini .scr{min-width:52px;font-size:13px;padding:3px 6px}
  .scroll{max-height:440px;overflow:auto;margin-right:-8px;padding-right:8px}

  /* ============ CẦU THỦ ============ */
  .pl{display:grid;grid-template-columns:22px 44px minmax(0,1fr) 44px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .plist>.pl:first-child{border-top:0}
  .pl .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .who small{color:var(--mute);font-size:12px}
  .pl .v{font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .ph{position:relative;width:44px;height:44px}
  .ph .ico{width:44px;height:44px}.ph .ico img{width:30px;height:30px}
  .ph .pp{position:absolute;inset:0;width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#fff;border:2px solid var(--line)}
  .ph .bd{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#fff;display:grid;place-items:center;border:2px solid var(--s1)}
  .ph .bd img{width:13px;height:13px;object-fit:contain}
  .ph.nophoto .pp,.ph.nophoto .bd{display:none}
  .seg2{display:inline-flex;padding:3px;border-radius:9px;background:var(--s2);border:1px solid var(--line)}
  .seg2 button{border:0;background:transparent;color:var(--mute);font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer}
  .seg2 button.on{background:var(--a1);color:var(--on)}

  /* ============ TIN TỨC ============ */
  .news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .nw{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .15s,transform .15s}
  .nw:hover{border-color:var(--a1);transform:translateY(-2px)}
  .nw .im{aspect-ratio:16/9;background:linear-gradient(135deg,var(--brand),var(--s3));overflow:hidden}
  .nw .im img{width:100%;height:100%;object-fit:cover;display:block}
  .nw .bd2{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .nw h3{font-size:15px;line-height:1.35;font-weight:700}
  .nw p{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .nw .tm2{margin-top:auto;font-size:11.5px;color:var(--mute);padding-top:6px}
  .nw .trn{display:none}.nw .eng{display:inline}
  .nw.tr .trn{display:inline;color:var(--a1)}.nw.tr .eng{display:none}
  /* tổng quan: 3 thẻ (máy tính) / 4 thẻ (máy tính bảng) / vuốt ngang (điện thoại) */
  .news.h .nw:nth-child(4){display:none}
  /* trang tin tức: 1 bài nổi bật + 9 bài (lưới 3 cột) */
  .news.np .nw.big{grid-column:1/-1;flex-direction:row}
  .news.np .nw.big .im{flex:0 0 52%;aspect-ratio:auto;min-height:240px}
  .news.np .nw.big .bd2{padding:22px 26px;justify-content:center}
  .news.np .nw.big h3{font-size:24px}
  .news.np .nw.big p{-webkit-line-clamp:4}

  /* ============ ĐỘI BÓNG ============ */
  .tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .tc{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:center;transition:.15s}
  .tc:hover{border-color:var(--a1);transform:translateY(-2px)}
  .tc b{font-weight:700}
  .tc small{color:var(--mute);font-size:12px}
  .th2{display:flex;align-items:center;gap:22px;padding:26px 28px;position:relative;overflow:hidden}
  .th2:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--a1)}
  .th2 h1{font-family:var(--disp);font-size:clamp(34px,5vw,52px);line-height:1;text-transform:uppercase;font-weight:800}
  .th2 .meta{color:var(--mute);margin-top:6px;font-size:13px}
  .ps2{display:grid;grid-template-columns:repeat(5,1fr);margin-top:16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .ps2 .sc b{font-size:22px}
  .ros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
  .ros .pr{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .ros .pr .j{text-align:center;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
  .ros .pr b{font-weight:600}
  .ros .pr small{color:var(--mute);font-size:12px;display:block}
  .ros .pr .ag{color:var(--mute);font-size:12px}
  .grp{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--a1);padding:16px 0 4px;grid-column:1/-1}
  .grp:first-child{padding-top:0}

  /* ============ FOOTER ============ */
  footer{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);padding-bottom:40px}
  .legal{margin-bottom:22px;text-align:center;font-size:12px;color:var(--mute)}
  .about{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .ctitle{width:100%;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute);margin-bottom:-2px}
  .me{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 280px}
  .av{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:20px;font-weight:800;color:var(--on);background:var(--a1);border:2px solid var(--line)}
  .av img{width:100%;height:100%;object-fit:cover}
  .me b{display:block;font-size:17px;font-weight:700;line-height:1.2}
  .me .role{color:var(--a1);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
  .me p{margin-top:2px;font-size:13px;color:var(--mute);max-width:46ch}
  .me .role:empty,.me p:empty{display:none}
  .soc{display:flex;gap:10px;flex-wrap:wrap}
  .soc a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;color:#fff;font-weight:600;font-size:13px;background:var(--s1);border:1px solid var(--line);transition:.15s}
  .soc a:hover{border-color:var(--a1);color:var(--a1)}
  .soc svg{width:18px;height:18px;fill:currentColor}
  .soc svg.st{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #err{color:#f87171;margin-top:12px}

  /* ============ MÁY TÍNH BẢNG ============ */
  @media(max-width:960px){
    .cols{display:flex;flex-direction:column;align-items:stretch;gap:12px}
    .main,.side{display:contents}
    .hero{grid-template-columns:1fr;padding:26px 22px;gap:22px}
    .gauge{width:190px;justify-self:start}
    .strip{grid-template-columns:repeat(2,1fr)}
    .sc:nth-child(3){border-left:0}
    .sc:nth-child(n+3){border-top:1px solid var(--line)}
    .news{grid-template-columns:repeat(2,minmax(0,1fr))}
    .news.h .nw:nth-child(4){display:flex}
    .news.np .nw:nth-child(10){display:none}
    .news.np .nw.big .im{flex-basis:46%}
    .ps2{grid-template-columns:repeat(3,1fr)}
    .ps2 .sc:nth-child(4){border-left:0}
    .ps2 .sc:nth-child(n+4){border-top:1px solid var(--line)}
    .ps2 .sc:nth-child(3){border-left:1px solid var(--line)}
    .ps2 .sc:nth-child(n+3){border-top:0}
    .ps2 .sc:nth-child(n+4){border-top:1px solid var(--line)}
  }
  /* ============ ĐIỆN THOẠI ============ */
  @media(max-width:620px){
    body{font-size:13.5px}
    .wrap{padding:0 12px}
    .top-in{flex-wrap:wrap;height:auto;padding:10px 12px;gap:8px 10px}
    .brand{flex:1;font-size:15px}
    .brand i{width:28px;height:28px;font-size:15px}
    .actions{order:2}
    #season{display:none}
    #btn{padding:7px 12px;font-size:12px}
    .leagues{order:3;flex:1 0 100%;margin:0 -12px;padding:0 12px}
    .lg{padding:7px 12px;font-size:13px}
    .sec-in{padding:0 6px}
    .sec{padding:0 12px;height:44px}
    .sec.on:after{left:10px;right:10px}

    .ad{gap:10px;padding:8px 10px;margin-top:12px}
    .adav{width:34px;height:34px}
    .adtag{font-size:9px;letter-spacing:.8px}
    #adLine{font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .adcta{padding:7px 10px;font-size:12px}
    .adx{width:22px;height:22px}
    #view{padding-top:12px}
    .view-title{font-size:21px}

    .hero{padding:22px 16px}
    .champ{gap:14px;margin:12px 0 18px}
    .ico.s84{width:60px;height:60px}.ico.s84 img{width:42px;height:42px}
    .name{font-size:clamp(32px,10vw,44px)}
    .kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px 0;padding-top:14px}
    .kpi{padding:0 0 0 16px}
    .kpi:nth-child(odd){padding-left:0;border-left:0}
    .gauge{width:170px;justify-self:center}
    .pct{font-size:44px}.pct small{font-size:22px}
    .strip{margin-top:12px}
    .sc{padding:12px 14px}.sc b{font-size:20px}.sc span{font-size:10px}
    .cols{margin-top:12px}

    .card{padding:16px}
    h2{font-size:14px}
    .th{display:none}
    .row{grid-template-columns:20px 30px minmax(0,1fr) 36px;gap:8px 10px;padding:10px 0}
    .row .pj{display:none}
    .row .prob{grid-column:2/-1}
    .row.top1{margin:0 -8px;padding:10px 8px}

    .pg,.grid2.h{display:flex;overflow-x:auto;gap:12px;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
    .pg::-webkit-scrollbar{display:none}
    .pg .pm{flex:0 0 84%;scroll-snap-align:center}
    .grid2{grid-template-columns:1fr}
    .scroll{max-height:380px}

    .mrow{grid-template-columns:44px minmax(0,1fr) 54px minmax(0,1fr);gap:6px;padding:11px 4px;font-size:12.5px}
    .mrow .t{gap:6px}
    .scr{font-size:14px}
    .mh{padding:22px 12px}
    .mh .big{font-size:44px}
    .mh .tm{font-size:14px}
    .mh .teams{gap:8px}
    .ico.s56{width:44px;height:44px}.ico.s56 img{width:30px;height:30px}
    .lu{grid-template-columns:1fr;gap:18px}
    .tl{grid-template-columns:44px 24px minmax(0,1fr)}
    .sb .r{grid-template-columns:44px 1fr 44px}

    .news.np{grid-template-columns:1fr}
    .news.np .nw:nth-child(10){display:flex}
    .news.np .nw.big{flex-direction:column}
    .news.np .nw.big .im{flex:none;aspect-ratio:16/9;min-height:0}
    .news.np .nw.big .bd2{padding:14px 16px 16px}
    .news.np .nw.big h3{font-size:18px}
    .news.h{display:flex;overflow-x:auto;gap:12px;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
    .news.h::-webkit-scrollbar{display:none}
    .news.h .nw,.news.h .nw:nth-child(4){display:flex;flex:0 0 82%;scroll-snap-align:center}
    .tg{grid-template-columns:repeat(2,1fr);gap:10px}
    .th2{padding:20px 16px;gap:14px}
    .ps2{grid-template-columns:repeat(2,1fr)}
    .ps2 .sc{border-left:0!important;border-top:1px solid var(--line)!important}
    .ps2 .sc:nth-child(even){border-left:1px solid var(--line)!important}
    .ps2 .sc:nth-child(-n+2){border-top:0!important}
    .ros{grid-template-columns:1fr}

    .ft-h,.ft{min-width:620px}
    footer{margin-top:24px}
    .soc{width:100%}.soc a{flex:1;justify-content:center}
  }

  /* ============ CHẾ ĐỘ "NHÀ CÁI" (GIẢ) ============ */
  .wallet,.dep,.wd,.ticker{display:none}
  .skin{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;color:#fff;white-space:nowrap}
  .skin:hover{background:rgba(255,255,255,.2)}
  .gbtn{display:inline-block;border:0;cursor:pointer;text-align:center;font-weight:800;letter-spacing:.3px;padding:11px 18px;border-radius:10px;color:#1a1400;
    background:linear-gradient(180deg,#ffe45c,#ffc400);box-shadow:0 4px 14px rgba(255,196,0,.28);transition:filter .15s,transform .15s}
  .gbtn:hover{filter:brightness(1.07);transform:translateY(-1px)}
  .joke{margin-top:-12px;color:#c9a227}

  body.bet{--bg:#060d08;--s1:#0c1810;--s2:#112117;--s3:#183022;--line:#1e3b2a;--brand:#07290f;--a1:#ffd400;--on:#1a1400;--gold:#ffd400;--mute:#8fa597}
  body.bet .top{background:linear-gradient(90deg,#07290f,#0d4a1c 55%,#07290f);border-bottom:2px solid #ffd400}
  body.bet .brand i{background:#ffd400}
  body.bet .lg.on{background:#ffd400;color:#1a1400}
  body.bet .wallet{display:inline-flex;align-items:center;padding:7px 14px;border-radius:999px;background:#031007;border:1px solid #ffd400;color:#ffd400;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  body.bet .dep,body.bet .wd{display:inline-block;border:0;border-radius:8px;padding:8px 12px;font-weight:800;font-size:12.5px;cursor:pointer}
  body.bet .dep{background:#22c55e;color:#031a0b}
  body.bet .wd{background:transparent;border:1px solid #ffd400;color:#ffd400}
  body.bet #btn{background:rgba(255,212,0,.12);border-color:rgba(255,212,0,.5);color:#ffd400}
  body.bet .sections{background:rgba(6,13,8,.94)}
  body.bet .sec.on:after{background:#ffd400}
  body.bet .ticker{display:block;overflow:hidden;white-space:nowrap;background:#030a05;border-bottom:1px solid var(--line)}
  .tk{display:inline-block;padding:7px 0;animation:tick 70s linear infinite}
  .tk:hover{animation-play-state:paused}
  @keyframes tick{to{transform:translateX(-50%)}}
  .tk span{display:inline-block;margin:0 26px;font-size:12.5px;color:#cfe8d8}
  .tk b{color:#ffd400}
  body.bet h2:before{background:linear-gradient(#ffd400,#ff9800)}
  body.bet .hero:before{background:linear-gradient(#ffd400,#ff9800)}
  body.bet .tab.on,body.bet .chip.on,body.bet .seg button.on{background:#ffd400;color:#1a1400}
  body.bet .view-title{background:linear-gradient(90deg,#ffe45c,#ffc400);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}

  /* khuyến mãi + jackpot */
  .promo{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:16px 20px;border-radius:var(--r);border:1px solid #ffd400;
    background:radial-gradient(500px 120px at 0 0,rgba(255,212,0,.22),transparent),linear-gradient(90deg,#10331a,#0a1f10)}
  .promo b{display:block;font-size:18px;color:#ffd400;letter-spacing:.3px}
  .promo span{display:block;font-size:13px;color:#cfe8d8;margin-top:2px}
  .promo .jp{text-align:center}
  .promo .jp small{display:block;font-size:11px;letter-spacing:1.4px;color:#cfe8d8}
  .promo .jp b{font-family:var(--disp);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}

  /* trang kèo */
  .orow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .day+.orow{border-top:0}
  .ot{font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
  .oteams{display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;font-weight:600}
  .oteams>div{display:flex;align-items:center;gap:10px;min-width:0}
  .oteams span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .oteams:hover span{color:var(--a1)}
  .obs{display:flex;gap:8px}
  .ob{display:flex;flex-direction:column;align-items:center;gap:1px;width:68px;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--s2);color:var(--ink);cursor:pointer;transition:.15s}
  .ob i{font-style:normal;font-size:10px;font-weight:800;color:var(--mute)}
  .ob b{font-variant-numeric:tabular-nums;color:#ffd400;font-size:15px}
  .ob:hover{border-color:#ffd400}
  .ob.on{background:#ffd400;border-color:#ffd400}
  .ob.on b,.ob.on i{color:#1a1400}

  /* phiếu cược */
  .slip{position:sticky;top:68px}
  .sel{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .ch+.sel{border-top:0}
  .sel b{font-weight:600}
  .sel small{display:block;color:var(--mute);font-size:12px}
  .sel em{font-style:normal;color:#ffd400;font-weight:700}
  .rm{border:0;background:var(--s3);color:var(--mute);width:24px;height:24px;border-radius:50%;cursor:pointer;flex:none}
  .rm:hover{color:#fff}
  .srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);color:var(--mute)}
  .srow b{color:#fff;font-variant-numeric:tabular-nums}
  .srow.big b{color:#ffd400;font-size:18px}
  .stk{display:block;margin:6px 0;font-size:12px;color:var(--mute)}
  .stk input{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:#fff;font:inherit;font-size:16px;font-weight:700}
  .stk input:focus{outline:none;border-color:#ffd400}
  .qk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
  .qk button{border:1px solid var(--line);background:var(--s2);color:var(--ink);border-radius:8px;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer}
  .qk button:hover{border-color:#ffd400;color:#ffd400}
  #place{width:100%;margin-top:6px}
  .fine{margin-top:10px;font-size:11px;color:var(--mute);text-align:center}

  /* phiếu của tôi */
  .bcard{margin-bottom:12px}
  .bcard.W{border-color:#22c55e}.bcard.L{border-color:#7f1d1d}
  .st{font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 10px;border-radius:6px;background:var(--s3)}
  .st.W{background:#16a34a;color:#fff}.st.L{background:#b91c1c;color:#fff}
  .ch>.st{font-size:11px}
  .bsel{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  .bsel small{display:block;color:var(--mute);font-size:12px}
  .bfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
  .bfoot b{color:#fff}.bfoot .g{color:#4ade80}.bfoot .r{color:#f87171}

  /* thông báo + hộp thoại */
  #toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
  .toast{padding:12px 16px;border-radius:12px;background:#111a14;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:600;font-size:13.5px;transition:.4s}
  .toast.ok{border-color:#22c55e}.toast.bad{border-color:#ef4444}
  .toast.out{opacity:0;transform:translateX(20px)}
  .overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
  .mdl{position:relative;width:min(420px,100%);background:var(--s1);border:1px solid #ffd400;border-radius:16px;padding:26px 24px}
  .mdl h3{font-size:20px;margin-bottom:10px}
  .mdl p{color:#cfe8d8;margin-bottom:12px}
  .mdl .gbtn{width:100%}
  .mx{position:absolute;right:12px;top:12px;border:0;background:var(--s3);color:var(--mute);width:28px;height:28px;border-radius:50%;cursor:pointer}

  @media(max-width:960px){
    .slip{position:static}
    #slip.has{order:-1}
    body.bet .wd{display:none}
  }
  @media(max-width:620px){
    .skin{padding:7px 10px;font-size:11px}
    body.bet .wallet{padding:6px 10px;font-size:12.5px}
    body.bet .dep{display:none}
    .promo{padding:14px 16px}.promo b{font-size:16px}.promo .jp b{font-size:28px}
    .promo .gbtn{width:100%}
    .orow{grid-template-columns:44px minmax(0,1fr);gap:8px 10px}
    .obs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}
    .ob{width:auto}
    #toasts{left:12px;right:12px;bottom:12px;max-width:none}
  }

  /* ===== HEADER + BANNER: to, rõ, sáng ===== */
  .top{box-shadow:0 4px 24px rgba(0,0,0,.45)}
  .top-in{height:76px}
  .brand{font-size:24px;gap:12px}
  .brand i{width:46px;height:46px;border-radius:12px;font-size:24px}
  .lg{font-size:15px;padding:10px 18px}
  .actions{gap:10px}
  #btn,.skin{font-size:13.5px;padding:10px 16px}
  .sec{height:54px;font-size:15px}
  body.bet .top{background:linear-gradient(90deg,#0a3d17,#13722c 50%,#0a3d17);border-bottom:3px solid #ffd400}
  body.bet .brand span{color:#ffe45c;text-shadow:0 0 18px rgba(255,212,0,.55)}
  body.bet .wallet{font-size:16px;background:#021408;box-shadow:0 0 14px rgba(255,212,0,.35)}
  body.bet .dep,body.bet .wd{font-size:14px;padding:10px 16px}
  body.bet .dep{box-shadow:0 0 14px rgba(34,197,94,.55)}
  .ad{position:relative;gap:18px;padding:18px 22px;margin-top:18px;border:2px solid #ffd400;border-radius:16px;
    background:radial-gradient(600px 160px at 0 0,rgba(255,212,0,.35),transparent),linear-gradient(90deg,#14502a,#0d3a1d);
    box-shadow:0 0 28px rgba(255,212,0,.28),inset 0 0 30px rgba(255,212,0,.07)}
  .adav{width:76px;height:76px;border:3px solid #ffd400;box-shadow:0 0 18px rgba(255,212,0,.6)}
  .adtag{font-size:14px;letter-spacing:1.6px;color:#ffe45c;text-shadow:0 0 12px rgba(255,212,0,.5)}
  .adtxt b{font-size:26px;font-weight:800;color:#fff;line-height:1.2}
  #adLine{font-size:15px;color:#e3f5ea;margin-top:2px}
  .adcta{font-size:16px;font-weight:800;padding:14px 24px;border-radius:12px;background:linear-gradient(180deg,#ffe45c,#ffc400);box-shadow:0 4px 18px rgba(255,196,0,.5);animation:pulse 2s ease-in-out infinite}
  .adx{width:28px;height:28px;font-size:13px}
  @keyframes pulse{50%{transform:scale(1.05)}}
  @media(max-width:620px){
    .top-in{height:auto;padding:10px 12px}
    .brand{font-size:19px;gap:9px}
    .brand i{width:38px;height:38px;font-size:20px}
    .lg{font-size:14px;padding:8px 14px}
    #btn,.skin{font-size:12px;padding:8px 11px}
    .sec{height:48px;font-size:14px}
    .ad{display:grid;grid-template-columns:60px minmax(0,1fr);gap:8px 12px;padding:14px;margin-top:12px}
    .adav{width:60px;height:60px;grid-row:1}
    .adtag{font-size:11px;letter-spacing:1px}
    .adtxt b{font-size:20px}
    #adLine{font-size:13px}
    .adcta{grid-column:1/-1;padding:12px;font-size:15px}
    .adx{position:absolute;right:8px;top:8px;width:26px;height:26px}
    .adtxt{padding-right:24px}
  }

  /* ===== TRANG CHỦ: các hàng cân đối, thông tin quan trọng lên trước ===== */
  .cols.eq{align-items:stretch}
  .cols.eq>.card{display:flex;flex-direction:column;margin:0}
  @media(min-width:961px){
    .cols.eq .scroll{max-height:none;overflow:visible;margin-right:0;padding-right:0}
  }
</style>
</head>

const MEM = new Map(), INF = new Map();
function getJSON(url, ttl = 9*60e3){
  const c = MEM.get(url);
  if(c && !FORCE && Date.now()-c.t < ttl) return Promise.resolve(c.d);
  if(INF.has(url) && !FORCE) return INF.get(url);
  const p = (async()=>{
    const r = await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
    const d = await r.json(); MEM.set(url,{t:Date.now(), d}); return d;
  })();
  INF.set(url, p); p.then(()=>INF.delete(url), ()=>INF.delete(url));
  return p;
}

function predict(entries, L){
  const teams = entries.map(e=>{
    const s = Object.fromEntries(e.stats.map(x=>[x.name, x.value]));
    const gp = s.gamesPlayed||0, pts = s.points||0, left = Math.max(L.total-gp,0), ppg = gp ? pts/gp : 1.4;
    return {id:e.team.id, name:e.team.displayName, short:e.team.shortDisplayName||e.team.displayName, logo:e.team.logos?.[0]?.href, gp, pts, left, ppg, proj:pts+left*ppg,
            rank:s.rank||0, w:s.wins||0, d:s.ties||0, l:s.losses||0, gf:s.pointsFor||0, ga:s.pointsAgainst||0, gd:s.pointDifferential||0, zone:e.note?.description||""};
  });
  const maxProj = Math.max(...teams.map(t=>t.proj));
  const sigma = (2 + 1.2*Math.sqrt(Math.max(...teams.map(t=>t.left)))) * L.mult;
  teams.forEach(t=>t.wt = Math.exp(-(maxProj-t.proj)/sigma));
  const sum = teams.reduce((a,t)=>a+t.wt,0);
  teams.forEach(t=>t.prob = t.wt/sum*100);
  return teams.sort((a,b)=>b.prob-a.prob);
}

/* ================= DỰ ĐOÁN TRẬN (Poisson) ================= */
function poisson(l,k){ let p=Math.exp(-l); for(let i=1;i<=k;i++) p*=l/i; return p; }
function predictMatch(h, a, avg){
  const K = 3, shr = (v,gp)=>(v+K*avg)/(gp+K), att = t=>shr(t.gf,t.gp)/avg, def = t=>shr(t.ga,t.gp)/avg;
  const xh = avg*att(h)*def(a)*1.12, xa = avg*att(a)*def(h)*0.92;
  let pw=0,pd=0,pl=0,best=[0,0,-1];
  for(let i=0;i<=7;i++) for(let j=0;j<=7;j++){
    const p = poisson(xh,i)*poisson(xa,j);
    if(i>j) pw+=p; else if(i===j) pd+=p; else pl+=p;
    if(p>best[2]) best=[i,j,p];
  }
  const s = pw+pd+pl;
  return {w:pw/s*100, d:pd/s*100, l:pl/s*100, sh:best[0], sa:best[1], xh, xa};
}
const leagueAvg = tb => { const gp = tb.teams.reduce((a,t)=>a+t.gp,0); return gp ? tb.teams.reduce((a,t)=>a+t.gf,0)/gp : 1.4; };

  const avg = leagueAvg(tb), lim = Date.now()+7*864e5;

}
/* --- dịch tin tức sang tiếng Việt (Google Dịch, dự phòng MyMemory); bản dịch lưu 30 ngày --- */
const TRM = new Map();
const hid = s => { let h = 5381; for(const c of String(s)) h = ((h<<5)+h+c.charCodeAt(0))|0; return (h>>>0).toString(36); };
function trCached(text){
  if(!text) return "";
  if(TRM.has(text)) return TRM.get(text);
  try{ const c = JSON.parse(localStorage.getItem("tr_"+hid(text))||"null"); if(c && c.s===text && Date.now()-c.t<30*864e5){ TRM.set(text,c.d); return c.d; } }catch(e){}
  return "";
}
async function trFetch(text){
  const hit = trCached(text); if(hit) return hit;
  const q = encodeURIComponent(text.slice(0,900));
  let out = "";
  try{
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=${q}`);
    const j = await r.json(); out = j[0].map(x=>x[0]).join("");
  }catch(e){
    try{
      const r = await fetch(`https://api.mymemory.translated.net/get?q=${q}&langpair=en%7Cvi`);
      out = (await r.json()).responseData?.translatedText || "";
    }catch(e2){}
  }
  if(!out) return "";
  TRM.set(text,out);
  try{ localStorage.setItem("tr_"+hid(text), JSON.stringify({t:Date.now(), s:text, d:out})) }catch(e){}
  return out;
}

      const t = jobs[i++]; if(my!==TOKEN) return;
      const vi = await trFetch(t); if(!vi || my!==TOKEN) continue;
      document.querySelectorAll(`[data-tr="${hid(t)}"]`).forEach(el=>{ el.textContent = vi; const c = el.closest(".nw"); if(c) c.classList.add("tr"); });
    }
  };

}

VIEWS.matches = async(arg,my)=>{

  let cur = S.date;
  if(!cur) cur = cal ? (cal.includes(today) ? today : (cal.find(d=>d>today) || cal[cal.length-1])) : today;
  const prev = cal ? [...cal].reverse().find(d=>d<cur) : addDays(cur,-1);
  const next = cal ? cal.find(d=>d>cur) : addDays(cur,1);
  const evs = (await dayEvents(SLUG, cur.replace(/-/g,""))).sort((a,b)=>(b.state==="in")-(a.state==="in") || a.date-b.date);
  if(my!==TOKEN) return;
  S.hasLive = evs.some(e=>e.state==="in");
  const dd = new Date(cur+"T12:00:00");
  const label = dd.toLocaleDateString("vi-VN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
  $("view").innerHTML = `
    <div class="view-title">Lịch & kết quả</div><div class="view-sub">${LEAGUES[SLUG].name} · bấm vào trận đấu để xem diễn biến, thống kê và đội hình</div>
    <div class="datenav">
      <button class="dbtn" data-date="${prev||""}" ${prev?"":"disabled"} title="Ngày thi đấu trước">◀</button>
      <div class="dcur">${label}<small>${cur===today?"Hôm nay · ":""}${evs.length} trận${S.hasLive?" · có trận đang diễn ra":""}</small></div>
      <button class="dbtn" data-date="${next||""}" ${next?"":"disabled"} title="Ngày thi đấu sau">▶</button>
      <input class="dinp" type="date" value="${cur}" id="dpick">
      <button class="tbtn" data-date="${today}">Hôm nay</button>
    </div>
    <section class="card">${evs.length?evs.map(mrow).join(""):`<div class="empty">Không có trận đấu nào trong ngày này.</div>`}</section>`;
  const dp = $("dpick"); if(dp) dp.onchange = ()=>{ if(dp.value){ S.date = dp.value; route(); } };
};

/* --- Chi tiết trận --- */
const ST_ROWS = [["possessionPct","Kiểm soát bóng"],["totalShots","Số cú sút"],["shotsOnTarget","Sút trúng đích"],["wonCorners","Phạt góc"],["foulsCommitted","Phạm lỗi"],["offsides","Việt vị"],["yellowCards","Thẻ vàng"],["redCards","Thẻ đỏ"],["saves","Cứu thua"],["totalPasses","Đường chuyền"],["passPct","Chuyền chính xác"]];
VIEWS.match = async(id,my)=>{
  const [j, tb] = await Promise.all([getJSON(SITE+SLUG+"/summary?event="+id, 45e3), getTable(SLUG)]);
  if(my!==TOKEN) return;
  const comp = j.header.competitions[0], st = comp.status.type;
  const H = comp.competitors.find(x=>x.homeAway==="home"), A = comp.competitors.find(x=>x.homeAway==="away");
  const T = x => ({id:x.team.id, name:x.team.displayName, logo:x.team.logo||x.team.logos?.[0]?.href, score:x.score});
  const h = T(H), a = T(A), live = st.state==="in", pre = st.state==="pre";
  S.hasLive = live;
  const d = new Date(comp.date), gi = j.gameInfo||{};
  const keys = (j.keyEvents||[]).filter(k=>k.scoringPlay || /yellow|red|substitution|penalty|var/i.test(k.type?.type||""));
  const icon = k => k.scoringPlay?"⚽":/yellow/i.test(k.type.type)?"🟨":/red/i.test(k.type.type)?"🟥":/substitution/i.test(k.type.type)?"🔄":"•";
  const evHTML = keys.length ? keys.map(k=>{
    const p = k.participants||[], n0 = p[0]?.athlete?.displayName, n1 = p[1]?.athlete?.displayName;
    let main, sub = esc(k.team?.displayName||"");
    if(k.scoringPlay){ main = `${esc(n0||k.shortText||"Bàn thắng")}`; if(n1) sub += ` · Kiến tạo: ${esc(n1)}`; }
    else if(/substitution/i.test(k.type.type)){ main = `Vào: ${esc(n0||"")}`; if(n1) sub += ` · Ra: ${esc(n1)}`; }
    else main = `${esc(n0||k.shortText||k.type.text)} <small style="display:inline">· ${/yellow/i.test(k.type.type)?"Thẻ vàng":/red/i.test(k.type.type)?"Thẻ đỏ":esc(k.type.text)}</small>`;
    return `<div class="tl ${k.scoringPlay?"goal":""}"><div class="min">${esc(k.clock?.displayValue||"")}</div><div class="ic">${icon(k)}</div><div><b>${main}</b><small>${sub}</small></div></div>`;
  }).join("") : `<div class="empty">${pre?"Trận đấu chưa bắt đầu.":"Chưa có diễn biến được ghi nhận."}</div>`;

  const bt = {}; (j.boxscore?.teams||[]).forEach(t=>{ bt[t.team.id] = Object.fromEntries(t.statistics.map(s=>[s.name,s.displayValue])); });
  const sv = (id,n,k) => { let v = plainNum(bt[id]?.[n]); return n==="passPct" ? v*100 : v; };
  const fmtv = (n,v) => n==="possessionPct"||n==="passPct" ? Math.round(v)+"%" : Math.round(v);
  const statHTML = bt[h.id] && Object.keys(bt[h.id]).length ? ST_ROWS.filter(([n])=>bt[h.id][n]!==undefined).map(([n,lb])=>{
    const x = sv(h.id,n), y = sv(a.id,n), tot = x+y || 1;
    return `<div class="sb"><div class="r"><span>${fmtv(n,x)}</span><em>${lb}</em><span>${fmtv(n,y)}</span></div>
      <div class="bars"><i><b style="width:${x/tot*100}%"></b></i><i><b style="width:${y/tot*100}%"></b></i></div></div>`;
  }).join("") : `<div class="empty">${pre?"Thống kê sẽ có khi trận đấu bắt đầu.":"Chưa có thống kê."}</div>`;

  const lu = side => {
    const r = (j.rosters||[]).find(x=>x.homeAway===side); if(!r || !(r.roster||[]).length) return `<div class="empty">Chưa có đội hình.</div>`;
    const starters = r.roster.filter(p=>p.starter).sort((p,q)=>(+p.formationPlace||99)-(+q.formationPlace||99)), bench = r.roster.filter(p=>!p.starter);
    const line = p => `<div class="p"><span class="j">${esc(p.jersey||"")}</span><span class="tn">${esc(p.athlete?.displayName||"")}${p.subbedOut?`<span class="subd">▼</span>`:""}${p.subbedIn?`<span class="subi">▲</span>`:""}</span><span class="po">${esc(p.position?.abbreviation||"")}</span></div>`;
    return `<h3>${esc(r.team?.displayName||"")} ${r.formation?`<small>· sơ đồ ${esc(r.formation)}</small>`:""}</h3>
      <div class="sh">Đội hình xuất phát</div>${starters.map(line).join("")}<div class="sh">Dự bị</div>${bench.map(line).join("")}`;
  };
  const luHTML = `<div class="lu"><div>${lu("home")}</div><div>${lu("away")}</div></div>`;

  let predHTML = "";
  if(pre && tb.byId[h.id] && tb.byId[a.id]){
    const p = predictMatch(tb.byId[h.id], tb.byId[a.id], leagueAvg(tb));
    predHTML = `<section class="card" style="margin-top:16px"><div class="ch"><h2>Dự đoán của app</h2><span>Poisson · xG ${p.xh.toFixed(1)} – ${p.xa.toFixed(1)}</span></div>
      <div class="vs3" style="display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center"><b>${esc(h.name)}</b><span style="font-family:var(--disp);font-size:40px;font-weight:800">${p.sh} - ${p.sa}</span><b>${esc(a.name)}</b></div>
      <div class="wdl"><i class="h" style="width:${p.w}%"></i><i class="x" style="width:${p.d}%"></i><i class="a" style="width:${p.l}%"></i></div>
      <div class="wl"><span>Nhà thắng <b>${p.w.toFixed(0)}%</b></span><span>Hoà <b>${p.d.toFixed(0)}%</b></span><span>Khách thắng <b>${p.l.toFixed(0)}%</b></span></div></section>`;
  }
  const tabs = {events:evHTML, stats:statHTML, lineups:luHTML};
  const cur = tabs[S.mtab] ? S.mtab : "events";
  $("view").innerHTML = `
    <button class="back" id="backBtn">← Quay lại</button>
    <section class="card mh">
      <div class="meta">${esc(LEAGUES[SLUG].name)} · ${fmtD(d)} ${fmtT(d)}</div>
      <div class="teams">
        <div class="tm" data-go="team/${esc(h.id)}">${crest(h.logo,h.name,"s56")}<span>${esc(h.name)}</span></div>
        <div><div class="big">${pre?"vs":`${esc(h.score)} - ${esc(a.score)}`}</div><span class="stt ${live?"in":""}">${live?esc(comp.status.displayClock||"LIVE"):pre?"Chưa bắt đầu":esc(st.description||"Kết thúc")}</span></div>
        <div class="tm" data-go="team/${esc(a.id)}">${crest(a.logo,a.name,"s56")}<span>${esc(a.name)}</span></div>
      </div>
      <div class="info">${gi.venue?.fullName?`<span>🏟️ ${esc(gi.venue.fullName)}${gi.venue.address?.city?`, ${esc(gi.venue.address.city)}`:""}</span>`:""}${gi.attendance?`<span>👥 ${Number(gi.attendance).toLocaleString("vi-VN")} khán giả</span>`:""}${gi.officials?.[0]?.displayName?`<span>🧑‍⚖️ ${esc(gi.officials[0].displayName)}</span>`:""}</div>
    </section>
    ${predHTML}
    <div style="text-align:center"><div class="seg" id="mseg">
      <button data-t="events" class="${cur==="events"?"on":""}">Diễn biến</button><button data-t="stats" class="${cur==="stats"?"on":""}">Thống kê</button><button data-t="lineups" class="${cur==="lineups"?"on":""}">Đội hình</button></div></div>
    <section class="card" id="mbody">${tabs[cur]}</section>`;
  $("backBtn").onclick = ()=>{ history.length>1 ? history.back() : (location.hash="#/matches"); };
  $("mseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.mtab = b.dataset.t; $("mseg").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); $("mbody").innerHTML = tabs[S.mtab];
  });
};

/* --- Bảng xếp hạng --- */
const zoneClass = z => /relegat/i.test(z)?"z-r":/champions league|round of 16|promotion/i.test(z)?"z-g":/conference/i.test(z)?"z-t":/europa|play-?off|knockout/i.test(z)?"z-b":"";
const ZCOL = {"z-g":"#34d399","z-b":"#60a5fa","z-t":"#2dd4bf","z-r":"#f87171"};
VIEWS.table = async(arg,my)=>{
  const [tb, form] = await Promise.all([getTable(SLUG), getForm(SLUG).catch(()=>null)]);
  if(my!==TOKEN) return;
  const rows = [...tb.teams].sort((a,b)=>(a.rank||99)-(b.rank||99));

  $("view").innerHTML = `
    <div class="view-title">Bảng xếp hạng</div><div class="view-sub">${LEAGUES[SLUG].name} · mùa ${esc(tb.label.match(/\d{4}-\d{2}/)?.[0]||"")} · phong độ tính theo 5 trận gần nhất</div>
    <section class="card"><div class="tw">
      <div class="ft-h"><span class="c">#</span><span></span><span>Đội</span><span class="c">Trận</span><span class="c">T</span><span class="c">H</span><span class="c">B</span><span class="c">BT</span><span class="c">BB</span><span class="c">HS</span><span class="c">Điểm</span><span class="c">Phong độ</span><span class="c">Vô địch</span></div>
      ${rows.map(t=>`<div class="ft ${zoneClass(t.zone)}" data-go="team/${esc(t.id)}">
        <div class="c">${t.rank}</div>${crest(t.logo,t.name)}<div class="tmc"><span class="tn">${esc(t.name)}</span></div>
        <div class="c">${t.gp}</div><div class="c">${t.w}</div><div class="c">${t.d}</div><div class="c">${t.l}</div>
        <div class="c">${t.gf}</div><div class="c">${t.ga}</div><div class="c">${t.gd>0?"+":""}${t.gd}</div><div class="c p">${t.pts}</div>
        <div class="c">${form?formHTML(form[t.id]):"—"}</div><div class="c">${t.prob.toFixed(1)}%</div></div>`).join("")}

    getTable(SLUG), getJSON(SITE+SLUG+"/teams/"+id, 600e3),
    getJSON(SITE+SLUG+"/teams/"+id+"/schedule", 600e3).catch(()=>null),
    getJSON(SITE+SLUG+"/teams/"+id+"/roster", 3600e3).catch(()=>null),
    getForm(SLUG).catch(()=>null), getWindow(SLUG).catch(()=>[])]);
  if(my!==TOKEN) return;
  const T = info.team, t = tb.byId[id] || {};
  const past = (sch?.events||[]).map(mapEv).filter(e=>e.completed).sort((a,b)=>b.date-a.date).slice(0,8);
  const next = [...evs.filter(e=>e.state!=="post" && !e.completed && (e.h.id===id||e.a.id===id))].sort((a,b)=>a.date-b.date).slice(0,4);

  const groups = ["G","D","M","F"].map(k=>({k, list:athletes.filter(p=>p.position?.abbreviation===k).sort((a,b)=>(+a.jersey||99)-(+b.jersey||99))})).filter(g=>g.list.length);
  $("view").innerHTML = `
    <button class="back" id="backBtn">← Quay lại</button>
    <section class="card th2">${crest(T.logos?.[0]?.href, T.displayName, "s84")}
      <div><h1>${esc(T.displayName)}</h1><div class="meta">${t.rank?`Hạng ${t.rank} · ${t.pts} điểm · `:""}${LEAGUES[SLUG].name}${coach?` · HLV ${esc(coach.firstName+" "+coach.lastName)}`:""}</div>
        <div style="margin-top:10px">${form?formHTML(form[id]):""}</div></div></section>
    ${t.gp!==undefined?`<div class="ps2">
      <div class="sc"><span>Xếp hạng</span><b>${t.rank}</b><small>${t.pts} điểm</small></div>
      <div class="sc"><span>Thắng · Hoà · Thua</span><b>${t.w}-${t.d}-${t.l}</b><small>${t.gp} trận</small></div>
      <div class="sc"><span>Bàn thắng</span><b>${t.gf}</b><small>${t.gp?(t.gf/t.gp).toFixed(2):0} / trận</small></div>
      <div class="sc"><span>Bàn thua</span><b>${t.ga}</b><small>hiệu số ${t.gd>0?"+":""}${t.gd}</small></div>

    <div class="cols">

        <section class="card"><div class="ch"><h2>Kết quả gần đây</h2><span>${past.length} trận</span></div>

        <section class="card"><div class="ch"><h2>Danh sách cầu thủ</h2><span>${athletes.length} cầu thủ</span></div>

/* ================= ĐIỀU HƯỚNG ================= */
function parseRoute(){ const h = location.hash.replace(/^#\/?/,"").split("/"); return {view: VIEWS[h[0]] ? h[0] : "home", arg: h[1]}; }
function drawNav(view){
  const act = view==="team" ? "teams" : view==="match" ? "matches" : view;
  $("leagues").innerHTML = Object.entries(LEAGUES).map(([k,v])=>`<button class="lg ${k===SLUG?"on":""}" data-k="${k}">${v.name}</button>`).join("");
  $("secs").innerHTML = SECTIONS.map(([k,n,i])=>`<a class="sec ${k===act?"on":""}" href="#/${k==="home"?"":k}"><span>${i}</span>${n}</a>`).join("");
}
async function route(force){
  const my = ++TOKEN; FORCE = !!force;
  const {view, arg} = parseRoute();
  document.body.dataset.l = SLUG; drawNav(view);
  const key = [SLUG, view, arg||"", view==="matches"?"":"" ].join("|");
  if(key!==LASTKEY){ $("view").innerHTML = skeleton(); window.scrollTo({top:0,behavior:"instant"}); LASTKEY = key; }
  $("err").textContent = ""; S.hasLive = false;
  try{
    await VIEWS[view](arg, my);
    if(my===TOKEN){
      getTable(SLUG).then(tb=>{ if(my===TOKEN) $("season").textContent = "Mùa " + (tb.label.match(/\d{4}-\d{2}/)?.[0]||"hiện tại"); }).catch(()=>{});
      $("note").textContent = "Cập nhật lúc "+new Date().toLocaleString("vi-VN")+" · Tự động cập nhật · Dữ liệu: ESPN · Chỉ mang tính tham khảo";
      if(typeof afterRoute==="function") afterRoute(my, view);
    }
  }catch(e){
    if(my===TOKEN) $("view").innerHTML = `<div class="card"><div class="empty">Không tải được dữ liệu (${esc(e.message)}).<br><br><button class="tbtn" id="retry">Thử lại</button></div></div>`;
    const r = $("retry"); if(r) r.onclick = ()=>route(true);
  }
  FORCE = false;
}

/* ================= BANNER + LIÊN HỆ ================= */
const AD_LINES = [
  "Dự đoán bóng đá chuẩn hơn người yêu cũ đoán ý bạn 🔮",
  "Tỷ lệ đúng 100% — miễn là đội mạnh hơn thắng 😎",
  "Từng dự đoán Arsenal vô địch… đúng lúc Arsenal đang dẫn đầu 🧠",
  "Nhà tiên tri số 1 xóm — chưa ai kiểm chứng 🏆",
  "Giá: 0đ. Tiền cược: cũng 0đ. Cá độ là hại nha! 🚫",
  "Tư vấn miễn phí, trách nhiệm… cũng miễn phí 🤝",
  "Xem xong bấm theo dõi, tui vui, bạn cũng vui 🥹"
];
const ADX_LINES = ["Tắt gì mà tắt 😤", "Tui dỗi đó nha 🥺", "Thôi tắt thì tắt… 😭"];
function renderAd(){
  const first = (ME.name||"?")[0].toUpperCase();
  $("adAv").innerHTML = ME.avatar ? `<img src="${ME.avatar}" alt="" onerror="this.parentNode.textContent='${first}'">` : first;
  $("adName").textContent = ME.name;
  const fb = ME.links.facebook;
  if(fb) $("adCta").href = fb; else $("adCta").style.display = "none";
  let i = 0, clicks = 0; const line = $("adLine");
  line.textContent = AD_LINES[0];
  setInterval(()=>{ line.classList.add("out"); setTimeout(()=>{ i=(i+1)%AD_LINES.length; line.textContent=AD_LINES[i]; line.classList.remove("out"); },350); }, 4000);
  $("adx").onclick = ()=>{
    if(clicks < ADX_LINES.length){ line.textContent = ADX_LINES[clicks]; clicks++; $("ad").classList.remove("shake"); void $("ad").offsetWidth; $("ad").classList.add("shake"); }
    else $("ad").style.display = "none";
  };
}
function renderAbout(){
  $("meName").textContent = ME.name; $("meRole").textContent = ME.role; $("meBio").textContent = ME.bio;
  $("meAv").innerHTML = ME.avatar ? `<img src="${ME.avatar}" alt="" onerror="this.parentNode.textContent='${(ME.name||"?")[0].toUpperCase()}'">` : (ME.name||"?")[0].toUpperCase();
  $("meLinks").innerHTML = Object.entries(ME.links).filter(([,v])=>v).map(([k,v])=>{
    const href = k==="email" ? "mailto:"+v : v;
    return `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${LABEL[k]}" aria-label="${LABEL[k]}">${ICONS[k]}<span>${LABEL[k]}</span></a>`;
  }).join("");
}

/* ================= GIẢ LẬP NHÀ CÁI — CHỈ LÀ TRÒ ĐÙA, TOÀN BỘ LÀ XU ẢO =================
   Không có tiền thật, không nạp/rút thật, không nhập thông tin thanh toán, không liên kết tới trang cá cược nào.
   Dữ liệu (số dư xu ảo, phiếu cược) chỉ lưu trong trình duyệt của người chơi. */
const BET_KEY = "bet_v1";
const BETD = {bal:1000000, slip:[], bets:[], skin:true, stake:10000};
const ODDS = {};
function betLoad(){ try{ Object.assign(BETD, JSON.parse(localStorage.getItem(BET_KEY)||"{}")); }catch(e){} }
function betSave(){ try{ localStorage.setItem(BET_KEY, JSON.stringify(BETD)); }catch(e){} betHeader(); }
const xu = n => Math.round(n).toLocaleString("vi-VN");
const WIN_LINES  = ["Ăn rồi! Đại gia xu ảo là đây 😎", "Thắng đậm! (nhưng toàn xu ảo thôi nha) 🤑", "Soi kèo như thần, ra đường vẫn nghèo 😂"];
const LOSE_LINES = ["Thua rồi, bán nhà đi… (xu ảo thôi nha) 😭", "Kèo này thì bạn tôi cũng thua 🤡", "Nhà cái cười, bạn khóc, tui thì quay video 📹", "Thôi nghỉ đi, đừng có gỡ 😂"];
const pickOf = a => a[Math.floor(Math.random()*a.length)];

/* --- giao diện chung --- */
function betHeader(){
  document.body.classList.toggle("bet", !!BETD.skin);
  const br = $("brand"); br.querySelector("i").textContent = BETD.skin ? "🎰" : "⚽";
  br.querySelector("span").textContent = BETD.skin ? "KG68 Chú Cỏ Mỹ" : "Football Predictor";
  $("wallet").textContent = "💰 " + xu(BETD.bal) + " xu";
  $("skinBtn").textContent = BETD.skin ? "🎰 Nhà cái: BẬT" : "⚽ Nhà cái: TẮT";
}
function toast(msg, kind){
  const t = document.createElement("div"); t.className = "toast " + (kind||""); t.textContent = msg;
  let box = $("toasts"); if(!box){ box = document.createElement("div"); box.id = "toasts"; document.body.appendChild(box); }
  box.appendChild(t); setTimeout(()=>t.classList.add("out"), 4200); setTimeout(()=>t.remove(), 4700);
}
function modal(html){
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="mdl"><button class="mx" aria-label="Đóng">✕</button>${html}</div>`;
  o.addEventListener("click", e=>{ if(e.target===o || e.target.closest(".mx")) o.remove(); });
  document.body.appendChild(o); return o;
}

/* --- tỷ lệ kèo: lấy từ mô hình Poisson, trừ ~6% biên lợi nhuận cho giống nhà cái --- */
const oddsOf = p => { const f = x => Math.max(1.05, Math.round(100/Math.max(x,2)*0.94*100)/100); return {"1":f(p.w), "X":f(p.d), "2":f(p.l)}; };
const pickLabel = (s) => s.pick==="1" ? `${s.h} thắng` : s.pick==="2" ? `${s.a} thắng` : "Hoà";

/* --- phiếu cược (cược xiên) --- */
function toggleSel(eid, pick){
  const o = ODDS[eid]; if(!o) return;
  const i = BETD.slip.findIndex(s=>s.eid===eid);
  if(i>=0 && BETD.slip[i].pick===pick){ BETD.slip.splice(i,1); }
  else{
    const s = {eid, slug:SLUG, t:o.ev.date.getTime(), h:o.ev.h.short, a:o.ev.a.short, pick, odd:o.odds[pick]};
    if(i>=0) BETD.slip[i] = s; else BETD.slip.push(s);
  }
  betSave(); drawOdds(); drawSlip();
}
const slipOdd = () => BETD.slip.reduce((a,s)=>a*s.odd, 1);
function drawOdds(){
  document.querySelectorAll(".ob").forEach(b=>{
    const s = BETD.slip.find(x=>x.eid===b.dataset.eid); b.classList.toggle("on", !!s && s.pick===b.dataset.pick);
  });
}
function drawSlip(){
  const el = $("slip"); if(!el) return;
  const n = BETD.slip.length, tot = slipOdd();
  el.classList.toggle("has", n>0);
  el.innerHTML = `
    <div class="ch"><h2>Phiếu cược</h2><span>${n} kèo</span></div>
    ${n ? BETD.slip.map(s=>`<div class="sel"><div><b>${esc(s.h)} vs ${esc(s.a)}</b><small>${esc(pickLabel(s))} · tỷ lệ <em>${s.odd.toFixed(2)}</em></small></div><button class="rm" data-rm="${esc(s.eid)}" aria-label="Xoá">✕</button></div>`).join("")
        +`<div class="srow"><span>Tổng tỷ lệ</span><b>${tot.toFixed(2)}</b></div>
          <label class="stk">Tiền cược (xu ảo)<input id="stake" type="number" min="1000" step="1000" value="${BETD.stake}"></label>
          <div class="qk"><button data-q="10000">+10K</button><button data-q="50000">+50K</button><button data-q="100000">+100K</button><button data-q="max">TẤT TAY</button></div>
          <div class="srow big"><span>Thắng dự kiến</span><b id="pot">${xu(BETD.stake*tot)} xu</b></div>
          <button class="gbtn" id="place">ĐẶT CƯỢC (xu ảo)</button>`
      : `<div class="empty">Bấm vào tỷ lệ <b>1 · X · 2</b> để thêm kèo vào phiếu.</div>`}
    <div class="fine">Xu ảo, không có giá trị thật. Trang chỉ để troll cho vui.</div>`;
}
function placeBet(){
  const n = BETD.slip.length; if(!n) return;
  const stake = Math.floor(+$("stake").value || 0);
  if(stake < 1000) return toast("Cược tối thiểu 1.000 xu thôi bạn ơi 😅");
  if(stake > BETD.bal) return toast("Không đủ xu! Bấm Nạp để xin xu từ thiện 🥲","bad");
  BETD.stake = stake; BETD.bal -= stake;
  BETD.bets.unshift({id:Date.now(), t:Date.now(), stake, odd:+slipOdd().toFixed(2), sels:BETD.slip.map(s=>({...s})), status:"pending"});
  BETD.slip = []; betSave(); drawOdds(); drawSlip();
  toast("Đặt cược thành công 🎉 (xu ảo) — xem ở mục Phiếu cược","ok");
}

/* --- chấm kết quả phiếu cược khi trận kết thúc --- */
let SETTLING = false;
async function settleBets(){
  if(SETTLING) return; const pend = BETD.bets.filter(b=>b.status==="pending"); if(!pend.length) return;
  SETTLING = true; let changed = false;
  try{
    for(const b of pend){
      for(const s of b.sels){
        if(s.res || Date.now() < s.t + 105*60e3) continue;
        try{
          const j = await getJSON(SITE+s.slug+"/summary?event="+s.eid, 5*60e3);
          const c = j.header.competitions[0], ty = c.status.type; if(!(ty.completed || ty.state==="post")) continue;
          const H = c.competitors.find(x=>x.homeAway==="home"), A = c.competitors.find(x=>x.homeAway==="away");
          const hs = +H.score, as = +A.score; s.score = hs+"-"+as; s.res = hs>as?"1":hs<as?"2":"X"; s.ok = s.res===s.pick; changed = true;
        }catch(e){}
      }
      if(b.sels.some(s=>s.res && !s.ok)){ b.status = "L"; changed = true; toast(`Phiếu #${String(b.id).slice(-4)} THUA −${xu(b.stake)} xu. ${pickOf(LOSE_LINES)}`,"bad"); }
      else if(b.sels.every(s=>s.res && s.ok)){ b.status = "W"; b.payout = Math.round(b.stake*b.odd); BETD.bal += b.payout; changed = true; toast(`Phiếu #${String(b.id).slice(-4)} THẮNG +${xu(b.payout)} xu! ${pickOf(WIN_LINES)}`,"ok"); }
    }
  } finally { SETTLING = false; }
  if(changed){ betSave(); if(parseRoute().view==="bets") route(); }
}

/* --- trang Kèo cược --- */
VIEWS.odds = async(arg,my)=>{
  const [tb, evs] = await Promise.all([getTable(SLUG), getWindow(SLUG)]);
  if(my!==TOKEN) return;
  const avg = leagueAvg(tb), lim = Date.now()+7*864e5;
  const list = evs.filter(e=>e.state==="pre" && e.date<=lim && tb.byId[e.h.id] && tb.byId[e.a.id]).sort((a,b)=>a.date-b.date);
  for(const k in ODDS) delete ODDS[k];
  list.forEach(e=>{ ODDS[e.id] = {ev:e, odds:oddsOf(predictMatch(tb.byId[e.h.id], tb.byId[e.a.id], avg))}; });
  let last = "", rows = "";
  list.forEach(e=>{
    const d = fmtD(e.date); if(d!==last){ rows += `<div class="day">${d}</div>`; last = d; }
    const o = ODDS[e.id].odds;
    rows += `<div class="orow"><div class="ot">${fmtT(e.date)}</div>
      <div class="oteams" data-go="match/${esc(e.id)}"><div>${crest(e.h.logo,e.h.name,"s24")}<span>${esc(e.h.short)}</span></div><div>${crest(e.a.logo,e.a.name,"s24")}<span>${esc(e.a.short)}</span></div></div>
      <div class="obs">${["1","X","2"].map(k=>`<button class="ob" data-eid="${esc(e.id)}" data-pick="${k}"><i>${k}</i><b>${o[k].toFixed(2)}</b></button>`).join("")}</div></div>`;
  });
  $("view").innerHTML = `<div class="view-title">Kèo cược 🎰</div><div class="view-sub">${LEAGUES[SLUG].name} · tỷ lệ tính từ mô hình dự đoán · <b>chơi bằng xu ảo</b></div>
    <div class="cols"><div class="main"><section class="card">${list.length?rows:`<div class="empty">Chưa có trận nào trong 7 ngày tới.</div>`}</section></div>
    <aside class="side"><section class="card slip" id="slip"></section></aside></div>`;
  drawOdds(); drawSlip();
};

/* --- trang Phiếu cược --- */
VIEWS.bets = async(arg,my)=>{
  await settleBets(); if(my!==TOKEN) return;
  const won = BETD.bets.filter(b=>b.status==="W").reduce((a,b)=>a+b.payout-b.stake,0), lost = BETD.bets.filter(b=>b.status==="L").reduce((a,b)=>a+b.stake,0);
  const net = won - lost;
  $("view").innerHTML = `<div class="view-title">Phiếu cược của tôi 🧾</div><div class="view-sub">Toàn bộ là xu ảo · kết quả được chấm tự động khi trận đấu kết thúc</div>
    <div class="strip" style="margin-bottom:16px">
      <div class="sc"><span>Số dư</span><b>${xu(BETD.bal)}</b><small>xu ảo</small></div>
      <div class="sc"><span>Tổng phiếu</span><b>${BETD.bets.length}</b><small>${BETD.bets.filter(b=>b.status==="pending").length} đang chờ</small></div>
      <div class="sc"><span>Thắng / Thua</span><b>${BETD.bets.filter(b=>b.status==="W").length} / ${BETD.bets.filter(b=>b.status==="L").length}</b><small>phiếu</small></div>
      <div class="sc"><span>Lời / Lỗ</span><b style="color:${net>=0?"#4ade80":"#f87171"}">${net>=0?"+":""}${xu(net)}</b><small>xu ảo</small></div></div>
    ${BETD.bets.length ? BETD.bets.map(b=>`<section class="card bcard ${b.status}">
      <div class="ch"><h2>Phiếu #${String(b.id).slice(-4)} · ${b.sels.length>1?`xiên ${b.sels.length}`:"đơn"}</h2>
        <span class="st ${b.status}">${b.status==="W"?"THẮNG":b.status==="L"?"THUA":"ĐANG CHỜ"}</span></div>
      ${b.sels.map(s=>`<div class="bsel"><span>${s.res?(s.ok?"✅":"❌"):"⏳"}</span><div><b>${esc(s.h)} vs ${esc(s.a)}</b><small>${esc(pickLabel(s))} · @ ${s.odd.toFixed(2)}${s.score?` · KQ ${esc(s.score)}`:""}</small></div></div>`).join("")}
      <div class="bfoot"><span>Cược <b>${xu(b.stake)}</b> · tỷ lệ <b>${b.odd.toFixed(2)}</b></span><span>${b.status==="W"?`Nhận <b class="g">+${xu(b.payout)}</b>`:b.status==="L"?`<b class="r">−${xu(b.stake)}</b>`:`Thắng dự kiến <b>${xu(b.stake*b.odd)}</b>`}</span></div></section>`).join("")
      : `<section class="card"><div class="empty">Chưa có phiếu nào. Qua mục <a href="#/odds" style="color:var(--a1)">Kèo cược</a> chọn thử đi!</div></section>`}
    <div style="text-align:center;margin-top:16px"><button class="tbtn" id="resetBtn">♻️ Làm lại từ đầu (1.000.000 xu)</button></div>`;
  const r = $("resetBtn"); if(r) r.onclick = ()=>{ if(confirm("Xoá toàn bộ phiếu và đặt lại 1.000.000 xu ảo?")){ BETD.bal = 1000000; BETD.bets = []; BETD.slip = []; betSave(); route(); } };
};

/* --- khuyến mãi giả + jackpot giả + băng chuyền kèo --- */
let JP = 12345678;
function promoHTML(){
  return `<section class="promo" id="promo"><div><b>🎁 THƯỞNG CHÀO MỪNG 1.000%</b><span>Tặng ngay 1.000.000 xu ảo cho người chơi mới — nhận xong… vẫn là xu ảo 😂</span></div>
    <div class="jp"><small>💎 JACKPOT XU ẢO</small><b id="jp">${xu(JP)}</b></div>
    <a class="gbtn" href="#/odds">CƯỢC NGAY</a></section>`;
}
setInterval(()=>{ JP += Math.floor(Math.random()*997)+13; const e = $("jp"); if(e) e.textContent = xu(JP); }, 1300);

let TKKEY = "";
async function buildTicker(){
  if(TKKEY === SLUG) return; TKKEY = SLUG;
  try{
    const [tb, evs] = await Promise.all([getTable(SLUG), getWindow(SLUG)]); const avg = leagueAvg(tb);
    const items = evs.filter(e=>e.state==="pre" && tb.byId[e.h.id] && tb.byId[e.a.id]).sort((a,b)=>a.date-b.date).slice(0,10).map(e=>{
      const o = oddsOf(predictMatch(tb.byId[e.h.id], tb.byId[e.a.id], avg));
      return `<span>🔥 <b>${esc(e.h.short)}</b> ${o["1"].toFixed(2)} · Hoà ${o["X"].toFixed(2)} · <b>${esc(e.a.short)}</b> ${o["2"].toFixed(2)}</span>`;
    });
    const line = items.length ? items.join("") : `<span>🎰 Chào mừng đến KG68 Chú Cỏ Mỹ — sàn cược xu ảo số 1 hành tinh (chưa ai kiểm chứng)</span>`;
    $("tk").innerHTML = line + line;
  }catch(e){ TKKEY = ""; }
}

/* --- hook sau mỗi lần chuyển trang --- */
function afterRoute(my, view){
  betHeader();
  if(BETD.skin && (view==="home"||view==="odds") && !$("promo")) $("view").insertAdjacentHTML("afterbegin", promoHTML());
  buildTicker(); settleBets();
  if(BETD.bal < 1000 && !BETD.warned){ BETD.warned = true; toast("Hết xu rồi… bấm Nạp để nhận xu từ thiện 🥲","bad"); }
}

/* --- sự kiện --- */
function betInit(){
  betLoad();
  SECTIONS.splice(2, 0, ["odds","Kèo cược","🎰"]); SECTIONS.push(["bets","Phiếu cược","🧾"]);
  betHeader();
  $("skinBtn").onclick = ()=>{ BETD.skin = !BETD.skin; betSave(); route(); };
  $("depBtn").onclick = ()=>{
    const m = modal(`<h3>💰 Nạp tiền</h3><p>Đang kết nối ngân hàng… <b>…</b> xong rồi!</p>
      <p>Đùa thôi 😝 Đây là trang troll, chỉ có <b>xu ảo</b>. Không nạp được tiền thật, và đừng bao giờ nạp tiền vào mấy trang cá độ nha!</p>
      <button class="gbtn" id="freeXu">🎁 Nhận xu từ thiện +100.000</button>`);
    m.querySelector("#freeXu").onclick = ()=>{ BETD.bal += 100000; BETD.warned = false; betSave(); m.remove(); toast("Đã cộng 100.000 xu ảo. Lần sau nhớ giữ lấy nhà 😂","ok"); if(parseRoute().view==="bets") route(); };
  };
  $("wdBtn").onclick = ()=> modal(`<h3>🏧 Rút tiền</h3><p>Muốn rút hả? Rút… <b>kinh nghiệm</b> đi bạn ơi 😎</p>
      <p>Xu ảo không đổi ra tiền thật được đâu. Cá độ là hại — chơi cho vui thôi!</p>`);
  document.addEventListener("click", e=>{
    const ob = e.target.closest(".ob"); if(ob){ toggleSel(ob.dataset.eid, ob.dataset.pick); return; }
    const rm = e.target.closest("[data-rm]"); if(rm){ BETD.slip = BETD.slip.filter(s=>s.eid!==rm.dataset.rm); betSave(); drawOdds(); drawSlip(); return; }
    const q = e.target.closest("[data-q]"); if(q){ const v = q.dataset.q==="max" ? BETD.bal : (+$("stake").value||0)+(+q.dataset.q); $("stake").value = Math.max(0, Math.min(v, BETD.bal)); $("stake").dispatchEvent(new Event("input")); return; }
    if(e.target.closest("#place")) placeBet();
  });
  document.addEventListener("input", e=>{
    if(e.target.id==="stake"){ BETD.stake = Math.floor(+e.target.value||0); try{ localStorage.setItem(BET_KEY, JSON.stringify(BETD)); }catch(x){} const p = $("pot"); if(p) p.textContent = xu(BETD.stake*slipOdd())+" xu"; }
  });
  setInterval(()=>settleBets(), 3*60*1000);
}

/* ================= KHỞI ĐỘNG ================= */
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]"); if(g){ location.hash = "#/"+g.dataset.go; return; }
  const lg = e.target.closest(".lg"); if(lg){ SLUG = lg.dataset.k; try{ localStorage.setItem("league",SLUG) }catch(x){} S.date = null;
    const v = parseRoute().view; if(v==="team"||v==="match") location.hash = "#/"; else route(); return; }
  const dt = e.target.closest("[data-date]"); if(dt && dt.dataset.date){ S.date = dt.dataset.date; route(); return; }
});
window.addEventListener("hashchange", ()=>route());
$("brand").onclick = ()=>{ location.hash = "#/"; };
$("btn").onclick = async()=>{
  const b = $("btn"); b.disabled = true; b.textContent = "Đang cập nhật…";
  await route(true); b.disabled = false; b.textContent = "⟳ Cập nhật";
};
renderAbout(); renderAd(); betInit(); route();
setInterval(()=>route(), 10*60*1000);
setInterval(()=>{ if(S.hasLive && !document.hidden) route(true); }, 60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) route(); });

</script>
